<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>exec queue · sea trade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
	<canvas id="c"></canvas>
	<div id="hud">
		<div id="clock">day 1 · 00:00</div>
		<div class="stat"><span>queue</span><b id="qlen">0</b></div>
		<div class="stat"><span>events</span><b id="events">0</b></div>
		<div class="stat"><span>fleet</span><b id="ships">0</b></div>
		<div class="stat"><span>delivered</span><b id="delivered">0</b></div>
		<div class="stat"><span>consumed</span><b id="consumed">0</b></div>
		<div class="stat"><span>next event</span><b id="next">—</b></div>
		<div id="legend">
			<span class="good r">grain</span>
			<span class="good g">timber</span>
			<span class="good b">iron</span>
		</div>
		<div id="hint">click a port to dispatch · ship to select<br>space pause · j step 30 min</div>
		<details id="options"><summary>ship options</summary>
			<label><input id="docking" type="checkbox" checked> dock &amp; wait for cargo (reset)</label>
			<label><input id="glmLook" type="checkbox" checked> GLM ship &amp; stock style</label>
			<label><input id="routes" type="checkbox" checked> route lines</label>
			<label><input id="smooth" type="checkbox"> smooth positions</label>
			<div id="selectedShip">click a ship to select</div>
			<label>course <select id="destination"></select></label>
			<button id="reroute">reroute</button> <button id="sinkShip">sink ship</button>
		</details>
		<div id="timeline">
			<div class="caption"><span>time queue</span><span>next 20 min</span></div>
			<canvas id="qtl"></canvas>
			<div class="caption"><span>arrival</span><span>dispatch · consume</span></div>
		</div>
	</div>
	<div id="log">
		<div class="caption"><span>event log</span><span id="logRate"></span></div>
		<div id="logBody"></div>
	</div>
	<div id="controls">
		<button id="pause" title="space">pause</button>
		<div class="seg">
			<button data-mode="continuous" class="on">continuous</button>
			<button data-mode="jump" title="advance the clock in fixed 30 min steps">jump</button>
		</div>
		<input id="speed" type="range" min="0" max="1000" value="593">
		<output id="speedLabel">×60</output>
		<input id="fleet" type="range" min="4" max="30" value="30" title="fleet cap: ships wait in the queue until a slot frees">
		<output id="fleetLabel">30</output>
		<button id="reset">reset</button>
	</div>
</div>
<script src="exec_queue.js"></script>
<script src="sim.js"></script>
<script src="gui.js"></script>
</body>
</html>
